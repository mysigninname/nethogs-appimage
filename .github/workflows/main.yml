name: Build and Test NetHogs AppImage

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

env:
  NETHOGS_VERSION: "0.9.0"
  SHARUN_VERSION: "v0.8.1"
  APPIMAGE_NAME: "nethogs-x86_64.AppImage"
  DEBIAN_FRONTEND: noninteractive

jobs:
  build-test-package:
    name: Build, test, and package x86_64 AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            ca-certificates \
            clang \
            cmake \
            curl \
            file \
            fuse3 \
            git \
            jq \
            libcap2-bin \
            libncurses-dev \
            libpcap-dev \
            libseccomp-dev \
            llvm \
            meson \
            musl \
            musl-dev \
            musl-tools \
            patchelf \
            pkg-config \
            python3 \
            rsync \
            shellcheck \
            squashfs-tools \
            strace \
            sudo \
            tar \
            unzip \
            util-linux \
            wget \
            xz-utils

          sudo modprobe fuse || true

          test -x /usr/bin/musl-gcc
          test -x /usr/bin/llvm-objcopy

      - name: Prepare sources
        shell: bash
        run: |
          set -euxo pipefail

          WORK="$GITHUB_WORKSPACE/work"

          rm -rf "$WORK"
          mkdir -p "$WORK"

          cd "$WORK"

          curl -L --fail --retry 5 \
            "https://github.com/raboof/nethogs/archive/refs/tags/v${NETHOGS_VERSION}.tar.gz" \
            -o "nethogs-${NETHOGS_VERSION}.tar.gz"

          tar -xzf "nethogs-${NETHOGS_VERSION}.tar.gz"

          # Do not specify --branch here. uruntime v0.9.0 does not exist.
          git clone --depth=1 \
            https://github.com/VHSgunzo/uruntime.git \
            uruntime

          git clone --depth=1 \
            --branch "${SHARUN_VERSION}" \
            https://github.com/VHSgunzo/sharun.git \
            sharun

      - name: Build uruntime
        shell: bash
        run: |
          set -euxo pipefail

          WORK="$GITHUB_WORKSPACE/work"
          RUNTIME_DIR="$WORK/runtime"

          mkdir -p "$RUNTIME_DIR"

          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' \
              --tlsv1.2 \
              -sSf \
              https://sh.rustup.rs \
              | sh -s -- -y --profile minimal
          fi

          export PATH="$HOME/.cargo/bin:/usr/local/bin:/usr/bin:/bin:$PATH"

          rustup toolchain install nightly
          rustup target add \
            x86_64-unknown-linux-musl \
            --toolchain nightly
          rustup component add \
            rust-src \
            --toolchain nightly

          cd "$WORK/uruntime"

          export CC=/usr/bin/musl-gcc
          export CXX=/usr/bin/g++
          export AR=/usr/bin/ar
          export OBJCOPY=/usr/bin/llvm-objcopy

          export CC_x86_64_unknown_linux_musl=/usr/bin/musl-gcc
          export CXX_x86_64_unknown_linux_musl=/usr/bin/g++
          export AR_x86_64_unknown_linux_musl=/usr/bin/ar
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=/usr/bin/musl-gcc

          CC=/usr/bin/musl-gcc \
          CXX=/usr/bin/g++ \
          AR=/usr/bin/ar \
          OBJCOPY=/usr/bin/llvm-objcopy \
          CC_x86_64_unknown_linux_musl=/usr/bin/musl-gcc \
          CXX_x86_64_unknown_linux_musl=/usr/bin/g++ \
          AR_x86_64_unknown_linux_musl=/usr/bin/ar \
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=/usr/bin/musl-gcc \
            cargo +nightly xtask appimage-squashfs-x86_64

          RUNTIME_BIN="$(
            find target -type f \
              \( \
                -name uruntime \
                -o -name uruntime-x86_64 \
                -o -name '*appimage*x86_64*' \
              \) \
              -executable \
              -print \
              -quit
          )"

          test -n "$RUNTIME_BIN"

          install -Dm755 \
            "$RUNTIME_BIN" \
            "$RUNTIME_DIR/uruntime"

          file "$RUNTIME_DIR/uruntime"
          "$RUNTIME_DIR/uruntime" --appimage-version || true

      - name: Build sharun
        shell: bash
        run: |
          set -euxo pipefail

          WORK="$GITHUB_WORKSPACE/work"
          SHARUN_DIR="$WORK/sharun"
          RUNTIME_DIR="$WORK/runtime"

          cd "$SHARUN_DIR"

          if [ -f Makefile ]; then
            make -j"$(nproc)"
          elif [ -f meson.build ]; then
            meson setup build
            meson compile -C build
          elif [ -f Cargo.toml ]; then
            cargo build --release
          else
            echo "Unable to determine how to build sharun."
            exit 1
          fi

          SHARUN_BIN="$(
            find . -type f \
              \( -name sharun -o -name quick-sharun \) \
              -executable \
              -print \
              -quit
          )"

          test -n "$SHARUN_BIN"

          install -Dm755 \
            "$SHARUN_BIN" \
            "$RUNTIME_DIR/sharun"

          "$RUNTIME_DIR/sharun" --help || true

      - name: Build AppImage
        shell: bash
        run: |
          set -euxo pipefail

          WORK="$GITHUB_WORKSPACE/work"
          SOURCE_DIR="$WORK/nethogs-${NETHOGS_VERSION}"
          BUILD_DIR="$WORK/build"
          APPDIR="$BUILD_DIR/AppDir"
          RUNTIME="$WORK/runtime/uruntime"
          SHARUN="$WORK/runtime/sharun"
          APPIMAGE="$BUILD_DIR/${APPIMAGE_NAME}"
          SQUASHFS="$BUILD_DIR/${APPIMAGE_NAME}.squashfs"

          rm -rf "$BUILD_DIR"
          mkdir -p \
            "$APPDIR/usr/bin" \
            "$APPDIR/usr/share/man/man8" \
            "$APPDIR/usr/share/licenses/nethogs"

          cd "$SOURCE_DIR"

          make clean || true

          make -j"$(nproc)" \
            CXXFLAGS="-O2 -pipe -fno-semantic-interposition" \
            LDFLAGS="-Wl,-z,relro,-z,now"

          install -Dm755 \
            src/nethogs \
            "$APPDIR/usr/bin/nethogs"

          if [ -f doc/nethogs.8 ]; then
            install -Dm644 \
              doc/nethogs.8 \
              "$APPDIR/usr/share/man/man8/nethogs.8"
          fi

          install -Dm644 \
            COPYING \
            "$APPDIR/usr/share/licenses/nethogs/COPYING"

          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          set -eu

          APPDIR="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"

          export PATH="$APPDIR/usr/bin:$PATH"
          export TERM="${TERM:-xterm-256color}"

          exec "$APPDIR/usr/bin/nethogs" "$@"
          EOF

          chmod 0755 "$APPDIR/AppRun"

          "$SHARUN" \
            -g \
            -e \
            -s \
            -p "$APPDIR/usr/bin/nethogs"

          test -x "$APPDIR/usr/bin/nethogs"

          cat "$RUNTIME" > "$APPIMAGE"

          mksquashfs \
            "$APPDIR" \
            "$SQUASHFS" \
            -noappend \
            -comp xz \
            -Xbcj x86 \
            -all-root \
            -no-exports \
            -no-xattrs \
            -no-progress

          cat "$SQUASHFS" >> "$APPIMAGE"

          chmod 0755 "$APPIMAGE"

          test -s "$APPIMAGE"

          file "$APPIMAGE"
          stat -c '%n %s bytes' "$APPIMAGE"

      - name: Test AppImage locally
        shell: bash
        run: |
          set -euxo pipefail

          WORK="$GITHUB_WORKSPACE/work"
          APPIMAGE="$WORK/build/${APPIMAGE_NAME}"
          TEST_ROOT="$WORK/test-environment"

          rm -rf "$TEST_ROOT"
          mkdir -p \
            "$TEST_ROOT/home" \
            "$TEST_ROOT/tmp"

          export HOME="$TEST_ROOT/home"
          export TMPDIR="$TEST_ROOT/tmp"
          export APPIMAGE_EXTRACT_AND_RUN=1
          export NO_CLEANUP=1

          cd "$TEST_ROOT"

          "$APPIMAGE" --appimage-extract \
            > extract.log 2>&1

          test -x squashfs-root/AppRun
          test -x squashfs-root/usr/bin/nethogs

          timeout 15 \
            "$APPIMAGE" --help \
            > help.log 2>&1 || {
              rc=$?
              if [ "$rc" -ne 124 ] && [ "$rc" -ne 1 ]; then
                cat help.log
                exit "$rc"
              fi
            }

          test -s help.log

          timeout 15 \
            "$APPIMAGE" -V \
            > version.log 2>&1 || {
              rc=$?
              if [ "$rc" -ne 124 ] && [ "$rc" -ne 1 ]; then
                cat version.log
                exit "$rc"
              fi
            }

          ldd squashfs-root/usr/bin/nethogs || true

      - name: Test AppImage extraction in Debian
        shell: bash
        run: |
          set -euxo pipefail

          docker run --rm \
            -v "$GITHUB_WORKSPACE/work/build:/mnt/build:ro" \
            debian:12-slim \
            /bin/bash -euxo pipefail -c '
              apt-get update
              apt-get install -y ca-certificates file squashfs-tools

              mkdir -p /tmp/appimage-test
              cd /tmp/appimage-test

              cp /mnt/build/nethogs-x86_64.AppImage .
              chmod +x nethogs-x86_64.AppImage

              APPIMAGE_EXTRACT_AND_RUN=1 \
                ./nethogs-x86_64.AppImage \
                --appimage-extract

              test -x squashfs-root/AppRun
              test -x squashfs-root/usr/bin/nethogs
            '

      - name: Test AppImage extraction in Alpine
        shell: bash
        run: |
          set -euxo pipefail

          docker run --rm \
            -v "$GITHUB_WORKSPACE/work/build:/mnt/build:ro" \
            alpine:3.20 \
            /bin/sh -euxo pipefail -c '
              apk add --no-cache bash ca-certificates file squashfs-tools

              mkdir -p /tmp/appimage-test
              cd /tmp/appimage-test

              cp /mnt/build/nethogs-x86_64.AppImage .
              chmod +x nethogs-x86_64.AppImage

              APPIMAGE_EXTRACT_AND_RUN=1 \
                ./nethogs-x86_64.AppImage \
                --appimage-extract

              test -x squashfs-root/AppRun
              test -x squashfs-root/usr/bin/nethogs
            '

      - name: Verify final artifact
        shell: bash
        run: |
          set -euxo pipefail

          WORK="$GITHUB_WORKSPACE/work"
          APPIMAGE="$WORK/build/${APPIMAGE_NAME}"
          ARTIFACT_DIR="$GITHUB_WORKSPACE/artifacts"

          test -f "$APPIMAGE"
          test -x "$APPIMAGE"
          test -s "$APPIMAGE"

          rm -rf "$WORK/final-extract"
          mkdir -p "$WORK/final-extract"

          cd "$WORK/final-extract"

          APPIMAGE_EXTRACT_AND_RUN=1 \
            "$APPIMAGE" \
            --appimage-extract

          test -x squashfs-root/AppRun
          test -x squashfs-root/usr/bin/nethogs

          mkdir -p "$ARTIFACT_DIR"

          cp "$APPIMAGE" \
            "$ARTIFACT_DIR/${APPIMAGE_NAME}"

          sha256sum \
            "$ARTIFACT_DIR/${APPIMAGE_NAME}" \
            | tee "$ARTIFACT_DIR/${APPIMAGE_NAME}.sha256"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: nethogs-${{ env.NETHOGS_VERSION }}-x86_64-AppImage
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
